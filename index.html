<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Lab OS — A2S2 Bench Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bench:#0E1614;      /* anodized charcoal-green casing */
    --bench-2:#0A100F;
    --panel:#15211E;      /* raised panel */
    --panel-2:#1B2A26;
    --line:#243430;       /* hairline */
    --line-2:#2E423C;
    --text:#E8F0ED;
    --muted:#7E938C;
    --muted-2:#566962;
    --red:#E5484D;        /* scene object coding */
    --green:#46C26A;
    --blue:#4C8DFF;
    --go:#F2B23E;         /* the one bold spend: primary action */
    --go-ink:#1A1305;
    --agent:#7C5CFF;      /* the AI agent's accent (persistent across apps) */
    --ok:#46C26A; --warn:#F2B23E; --err:#E5484D;
    --r:14px;
    font-synthesis:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 80% -10%, #16241f 0%, transparent 60%),
      var(--bench);
    color:var(--text);
    font-family:"Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    user-select:none;
  }
  .app{height:100vh;display:flex;flex-direction:column}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:18px;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(var(--bench-2),transparent);
  }
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer}
  .mark{width:30px;height:30px;border-radius:8px;background:
      conic-gradient(from 210deg, var(--green), var(--blue) 40%, var(--red) 75%, var(--green));
      box-shadow:inset 0 0 0 4px var(--bench);position:relative}
  .mark::after{content:"";position:absolute;inset:9px;border-radius:3px;background:var(--bench)}
  .brand h1{font-family:"Space Grotesk";font-size:15px;font-weight:600;letter-spacing:.04em}
  .brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.12em;text-transform:uppercase}
  .top-spacer{flex:1}
  /* app selector — the primary "where am I / switch here" control */
  .app-picker{display:flex;align-items:center;gap:9px;padding:5px 6px 5px 14px;
    background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px}
  .app-picker-label{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .appsel{font-family:"Space Grotesk";font-weight:600;font-size:14px;letter-spacing:.01em;
    color:var(--text);background:var(--panel);
    border:1px solid var(--line-2);border-radius:9px;padding:8px 34px 8px 34px;cursor:pointer;outline:none;
    -webkit-appearance:none;appearance:none;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='%23E8F0ED' stroke-width='2'><rect x='3' y='3' width='7' height='7' rx='1.5'/><rect x='14' y='3' width='7' height='7' rx='1.5'/><rect x='3' y='14' width='7' height='7' rx='1.5'/><rect x='14' y='14' width='7' height='7' rx='1.5'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237E938C' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat,no-repeat;
    background-position:11px center,right 11px center}
  .appsel:hover{border-color:var(--go);background-color:var(--panel-2)}
  .app-picker:hover{border-color:var(--go)}
  .appsel option{background:var(--panel);color:var(--text);font-family:"Inter"}
  /* persistent agent button — reachable from any app */
  .agentbtn{display:inline-flex;align-items:center;gap:7px;font-family:"Space Grotesk";
    font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--agent);
    background:rgba(124,92,255,.10);border:1px solid rgba(124,92,255,.45);
    border-radius:999px;padding:6px 14px;cursor:pointer;outline:none}
  .agentbtn:hover{background:rgba(124,92,255,.18);border-color:rgba(124,92,255,.7)}
  .agentbtn .ab-mark{font-size:14px;line-height:1}
  .conn{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono";font-size:12px;
    padding:6px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted-2)}
  .conn.live .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .conn.demo .dot{background:var(--warn);box-shadow:0 0 10px var(--warn)}
  .clock{font-family:"IBM Plex Mono";font-size:13px;color:var(--muted);min-width:58px;text-align:right}

  /* ---------- bench status strip (signature) ---------- */
  .strip{padding:12px 22px;border-bottom:1px solid var(--line);background:var(--bench-2)}
  .strip-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .strip-head .label{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .strip-head .state{font-family:"IBM Plex Mono";font-size:12px;color:var(--muted)}
  .strip-head .state b{color:var(--text);font-weight:600}
  svg.bench{width:100%;height:96px;display:block}

  /* ---------- body ---------- */
  .body{flex:1;overflow:hidden;display:flex}
  .home{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:18px;padding:22px}
  .tile{
    position:relative;border:1px solid var(--line);border-radius:var(--r);
    background:linear-gradient(160deg,var(--panel),var(--bench));
    padding:26px 28px;cursor:pointer;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;
    transition:border-color .15s, transform .1s;
  }
  .tile:hover{border-color:var(--line-2)}
  .tile:active{transform:translateY(1px)}
  .tile .ico{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;
    border:1px solid var(--line-2);background:var(--bench-2)}
  .tile h2{font-family:"Space Grotesk";font-size:24px;font-weight:600;margin-top:auto;letter-spacing:.01em}
  .tile p{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.45;max-width:34ch}
  .tile .accent{position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;
    opacity:.10;filter:blur(6px)}
  .tile.ask .accent{background:var(--go)}
  .tile.proto .accent{background:var(--green)}
  .tile.modes .accent{background:var(--blue)}
  .tile.watch .accent{background:var(--blue)}
  .tile.samples .accent{background:var(--red)}
  .tile.agent .accent{background:var(--agent)}
  .tile.agent{border-color:rgba(124,92,255,.35)}
  .tile.agent:hover{border-color:rgba(124,92,255,.6)}
  .tile.agent .ico{border-color:rgba(124,92,255,.5)}
  .tile .badge{position:absolute;top:18px;right:18px;font-family:"IBM Plex Mono";font-size:12px;
    color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}

  /* ---------- drilled view ---------- */
  .view{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .view-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
  .back{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:18px}
  .back:hover{border-color:var(--line-2)}
  .view-head h2{font-family:"Space Grotesk";font-size:20px;font-weight:600}
  .view-head .sub{color:var(--muted);font-size:13px;margin-left:2px}
  .view-body{flex:1;overflow:auto;padding:22px}

  /* ask */
  .ask-wrap{max-width:760px;margin:0 auto}
  .ask-box{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:18px}
  textarea#task{width:100%;min-height:96px;resize:none;background:transparent;border:none;outline:none;
    color:var(--text);font-family:"Inter";font-size:18px;line-height:1.5}
  textarea#task::placeholder{color:var(--muted-2)}
  .ask-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:12px}
  .model-pick{display:flex;gap:6px}
  .chip{font-family:"IBM Plex Mono";font-size:12px;color:var(--muted);border:1px solid var(--line);
    background:var(--bench-2);border-radius:999px;padding:6px 12px;cursor:pointer}
  .chip.on{color:var(--go);border-color:var(--go)}
  .go{font-family:"Space Grotesk";font-weight:600;font-size:15px;letter-spacing:.02em;
    background:var(--go);color:var(--go-ink);border:none;border-radius:11px;padding:12px 22px;cursor:pointer;
    display:flex;align-items:center;gap:9px}
  .go:disabled{opacity:.45;cursor:not-allowed}
  .go:hover:not(:disabled){filter:brightness(1.06)}
  .suggest{margin-top:22px}
  .suggest .label{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .sug-list{display:flex;flex-wrap:wrap;gap:9px}
  .sug{font-size:14px;color:var(--text);border:1px solid var(--line);background:var(--panel);
    border-radius:999px;padding:9px 15px;cursor:pointer}
  .sug:hover{border-color:var(--line-2)}

  /* ai chat */
  .chat-body{padding:14px 22px;overflow:hidden;display:flex}
  .chat{display:flex;flex-direction:column;height:100%;width:100%;max-width:880px;margin:0 auto}
  .chat-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:0 2px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .chat-head .grp{display:flex;align-items:center;gap:6px}
  .chat-head .glabel{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2)}
  .chat-head .spacer{flex:1}
  .chat-new{font-family:"IBM Plex Mono";font-size:12px;color:var(--muted);border:1px solid var(--line);
    background:var(--panel);border-radius:999px;padding:6px 13px;cursor:pointer}
  .chat-new:hover{border-color:var(--line-2);color:var(--text)}
  .chat-thread{flex:1;overflow:auto;display:flex;flex-direction:column;gap:15px;padding:14px 2px}
  .msg{display:flex;flex-direction:column;gap:5px;max-width:90%}
  .msg.user{align-self:flex-end;align-items:flex-end}
  .msg.agent{align-self:flex-start;align-items:stretch;max-width:94%}
  .msg .who{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);padding:0 3px}
  .bubble{border-radius:14px;padding:11px 15px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.user .bubble{background:var(--go);color:var(--go-ink)}
  .msg.agent .bubble{background:var(--panel);border:1px solid var(--line);color:var(--text)}
  .bubble code{font-family:"IBM Plex Mono";font-size:13px;background:var(--bench-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .bubble strong{font-weight:650}
  .bubble pre{background:var(--bench-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;overflow:auto}
  .bubble pre code{border:none;background:none;padding:0;font-size:12.5px;line-height:1.5;color:#c9d6d1;white-space:pre}
  .tools{display:flex;flex-direction:column;gap:5px;width:100%;margin-bottom:2px}
  .tool{font-family:"IBM Plex Mono";font-size:12px;border:1px solid var(--line);background:var(--bench-2);border-radius:9px;overflow:hidden}
  .tool summary{cursor:pointer;padding:7px 11px;color:var(--muted);display:flex;align-items:center;gap:8px;list-style:none;white-space:nowrap;overflow:hidden}
  .tool summary::-webkit-details-marker{display:none}
  .tool .tname{color:var(--blue);flex-shrink:0}
  .tool .targs{color:var(--muted-2);overflow:hidden;text-overflow:ellipsis}
  .tool .tspin{color:var(--go);margin-left:auto;flex-shrink:0}
  .tool .tdone{color:var(--ok);margin-left:auto;flex-shrink:0}
  .tool pre{margin:0;padding:9px 11px;border-top:1px solid var(--line);background:var(--bench);color:#a9b8b2;
    font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}
  .cursor-blink{display:inline-block;width:7px;height:15px;background:var(--go);margin-left:2px;
    vertical-align:text-bottom;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .chat-empty{color:var(--muted);font-size:14.5px;text-align:center;margin:auto;max-width:48ch;line-height:1.65}
  .chat-input{display:flex;gap:10px;align-items:flex-end;border:1px solid var(--line);border-radius:14px;
    background:var(--panel);padding:11px 12px;margin-top:10px}
  .chat-input textarea{flex:1;background:transparent;border:none;outline:none;color:var(--text);
    font-family:"Inter";font-size:16px;line-height:1.5;resize:none;max-height:160px;min-height:26px}
  .chat-input textarea::placeholder{color:var(--muted-2)}

  /* protocol library */
  .lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;max-width:980px;margin:0 auto}
  .card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:18px;cursor:pointer;
    display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
  .card:hover{border-color:var(--line-2)}
  .card .swatch{width:100%;height:6px;border-radius:99px;background:var(--line-2)}
  .card.red .swatch{background:var(--red)} .card.green .swatch{background:var(--green)}
  .card.blue .swatch{background:var(--blue)} .card.amber .swatch{background:var(--go)}
  .card h3{font-family:"Space Grotesk";font-size:17px;font-weight:600}
  .card p{color:var(--muted);font-size:13.5px;line-height:1.5}
  .card .run-tag{font-family:"IBM Plex Mono";font-size:12px;color:var(--muted);margin-top:auto}
  .card .tagline{font-family:"IBM Plex Mono";font-size:12px;color:var(--muted);margin-top:auto}

  /* mode runner form */
  .runner{max-width:760px;margin:0 auto}
  .runner .lead{color:var(--muted);font-size:14.5px;line-height:1.6;margin-bottom:20px;max-width:62ch}
  .runner .ask-box{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:18px;margin-bottom:18px}
  .params{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
  .pfield{display:flex;flex-direction:column;gap:8px}
  .pfield > label{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .pfield input[type=number]{background:var(--bench-2);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-family:"IBM Plex Mono";font-size:15px;padding:10px 12px;outline:none;width:100%}
  .pfield input[type=number]:focus{border-color:var(--line-2)}
  .pchips{display:flex;flex-wrap:wrap;gap:6px}
  .ptoggle{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;color:var(--text)}
  .ptoggle input{width:18px;height:18px;accent-color:var(--go)}
  .runner-go{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .runner-go .note{font-family:"IBM Plex Mono";font-size:12px;color:var(--muted-2)}
  .stop{font-family:"Space Grotesk";font-weight:600;font-size:13px;background:transparent;color:var(--err);
    border:1px solid var(--err);border-radius:10px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .stop:hover{background:rgba(229,72,77,.12)}
  .mode-pill{font-family:"IBM Plex Mono";font-size:11px;color:var(--blue);border:1px solid var(--line);
    border-radius:999px;padding:3px 10px;text-transform:uppercase;letter-spacing:.08em}

  /* watch */
  .watch{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;height:100%}
  .watch.watch-solo{grid-template-columns:1fr;max-width:900px;margin:0 auto}
  .cam-live{position:relative;padding:0!important}
  .cam-feed{width:100%;height:100%;object-fit:contain;display:block;background:#0a100e}
  .cam-fallback{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--muted-2);padding:24px}
  .cam{border:1px solid var(--line);border-radius:var(--r);background:
      repeating-linear-gradient(45deg,#0c1311 0 12px,#0a100e 12px 24px);
      display:flex;flex-direction:column;overflow:hidden}
  .cam .cam-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);
    font-family:"IBM Plex Mono";font-size:12px;color:var(--muted);background:var(--bench-2)}
  .cam .cam-bar .rec{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
  .cam .cam-body{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted-2);padding:24px}
  .cam .cam-body .big{font-family:"Space Grotesk";font-size:16px;color:var(--muted);margin-bottom:6px}
  .readout{border:1px solid var(--line);border-radius:var(--r);background:var(--bench-2);display:flex;flex-direction:column;overflow:hidden}
  .readout .r-bar{padding:10px 14px;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono";
    font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
  .log{flex:1;overflow:auto;padding:12px 14px;font-family:"IBM Plex Mono";font-size:12.5px;line-height:1.65;color:#bcd}
  .log .l-plan{color:var(--go)} .log .l-ok{color:var(--ok)} .log .l-err{color:var(--err)} .log .l-dim{color:var(--muted-2)}
  .queue{margin-top:0}
  .q-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
  .q-item .q-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .q-running{background:var(--go);box-shadow:0 0 8px var(--go);animation:pulse 1.1s infinite}
  .q-done{background:var(--ok)} .q-err{background:var(--err)} .q-queued{background:var(--muted-2)}
  @keyframes pulse{50%{opacity:.35}}
  .q-item .q-task{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q-item .q-meta{font-family:"IBM Plex Mono";font-size:11px;color:var(--muted)}

  /* samples */
  .samples{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
  .s-row{display:grid;grid-template-columns:14px 1fr auto auto;align-items:center;gap:14px;
    border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px;cursor:pointer}
  .s-row:hover{border-color:var(--line-2)}
  .s-row .s-out{width:10px;height:10px;border-radius:50%}
  .s-row h4{font-size:14.5px;font-weight:500}
  .s-row .s-files{font-family:"IBM Plex Mono";font-size:11px;color:var(--muted-2);margin-top:3px}
  .s-row .s-model{font-family:"IBM Plex Mono";font-size:12px;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:999px}
  .s-row .s-time{font-family:"IBM Plex Mono";font-size:12px;color:var(--muted);min-width:120px;text-align:right}

  .empty{display:grid;place-items:center;height:100%;text-align:center;color:var(--muted)}
  .empty .e-card{max-width:380px}
  .empty h3{font-family:"Space Grotesk";font-size:18px;color:var(--text);margin-bottom:8px}
  .empty p{font-size:14px;line-height:1.6}
  .empty .go{margin:18px auto 0;display:inline-flex}

  .demo-banner{background:rgba(242,178,62,.10);border-bottom:1px solid rgba(242,178,62,.3);
    color:var(--go);font-family:"IBM Plex Mono";font-size:12px;padding:7px 22px;text-align:center;letter-spacing:.03em}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:3px solid var(--bench)}
  *:focus-visible{outline:2px solid var(--go);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="demoBanner" class="demo-banner" style="display:none">
    Demo bench — simulated runs. Start <code>server.py</code> on the lab machine to drive the live digital twin.
  </div>

  <div class="topbar">
    <div class="brand" onclick="go('home')">
      <div class="mark"></div>
      <div><h1>A2S2 Lab OS</h1><small>Twin Robot World</small></div>
    </div>
    <div id="appPicker" class="app-picker" style="display:none">
      <span class="app-picker-label">Choose app</span>
      <select id="appSel" class="appsel" title="Switch app" aria-label="Switch app"
              onchange="switchApp(this.value)"></select>
    </div>
    <button id="agentBtn" class="agentbtn" onclick="go('chat')" style="display:none"
            title="Open the AI agent — available in every app">
      <span class="ab-mark">✦</span><span>Agent</span>
    </button>
    <div class="top-spacer"></div>
    <div id="conn" class="conn demo"><span class="dot"></span><span id="connText">Demo bench</span></div>
    <div id="clock" class="clock">--:--</div>
  </div>

  <!-- live bench status strip — only shown for apps that declare a scene -->
  <div class="strip" id="benchStrip">
    <div class="strip-head">
      <span class="label">Bench layout · live state</span>
      <span class="state">arm <b id="armState">idle</b> · rail <b id="railState">0 mm</b></span>
    </div>
    <svg class="bench" id="benchSvg" viewBox="0 0 760 96" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="body" id="body"></div>
</div>

<script>
/* ============================================================
   Lab OS bench console — single-file kiosk shell.
   Talks to server.py when present (live mode); otherwise runs
   a clearly-labelled demo bench so the console is feelable alone.
============================================================ */

const SCENE = {
  cubes: [ {id:'red_cube',color:'red'}, {id:'green_cube',color:'green'}, {id:'blue_cube',color:'blue'} ],
  bins:  [ {id:'red_bin',color:'red'}, {id:'green_bin',color:'green'}, {id:'blue_bin',color:'blue'} ],
  racks: 2, tubesPerRack: 6
};

const STATE = {
  mode:'demo',          // 'live' | 'demo'
  view:'home',
  model:'haiku',
  apps:[],             // installed app manifests (from /api/health)
  appId:null,          // active content app id
  agentId:null,        // the AI-agent app id (chat:true) — a persistent place,
                       // reachable from every content app, not in the app menu
  modes:[],            // operating-mode descriptors (from /api/health|modes)
  runMode:null,        // mode id currently open in the runner form
  jobs:[],              // {id, sid, mode, task, status, log[], outcome, model, started}
  sessions:[],
  busy:false,
  chat:null,            // {id, es, messages[], cur, params:{brain,intent}, busy, ended, pendingReset}
  arm:'idle', rail:0
};

/* operating modes — overwritten by the server's app descriptors on boot.
   This fallback keeps the demo bench feelable with no server at all. */
const FALLBACK_MODES = [
  {id:'task',name:'Ask the bench',gallery:false,needs_task:true,
   params:[{id:'model',label:'Planner',type:'choice',choices:['haiku','sonnet'],default:'haiku'}]},
  {id:'learn',name:'Self-learning loop',tagline:'Repeat one task and improve',accent:'#46C26A',
   gallery:true,needs_task:true,task_hint:'e.g. Put the red cube in the red bin',
   desc:'The bench attempts a single task many times, learning as it goes.',
   params:[{id:'max_episodes',label:'Attempts',type:'int',default:10,min:2,max:50},
           {id:'stringency',label:'Grading',type:'choice',choices:['loose','normal','strict'],default:'loose'},
           {id:'model',label:'Planner',type:'choice',choices:['haiku','sonnet'],default:'haiku'}]},
  {id:'autoplay',name:'Auto-play batch',tagline:'The bench invents and runs varied tasks',accent:'#4C8DFF',
   gallery:true,needs_task:false,desc:'The bench writes a batch of diverse tasks and runs them back-to-back.',
   params:[{id:'episodes',label:'Tasks',type:'int',default:5,min:1,max:50},
           {id:'model',label:'Planner',type:'choice',choices:['haiku','sonnet'],default:'haiku'}]},
  {id:'random',name:'Random play',tagline:'Generate training data — no planner',accent:'#E5484D',
   gallery:true,needs_task:false,desc:'The arm samples random reachable poses with no language model in the loop.',
   params:[{id:'episodes',label:'Runs',type:'int',default:10,min:1,max:200},
           {id:'moves_per_episode',label:'Moves each',type:'int',default:8,min:1,max:40},
           {id:'seed',label:'Seed',type:'int',default:'',min:0,max:999999,optional:true}]},
  {id:'augment',name:'Augment a task',tagline:'Many variations of one task',accent:'#F2B23E',
   gallery:true,needs_task:true,task_hint:'e.g. Put the red cube in the red bin',
   desc:'Runs one task across several cycles, rewording it and nudging object positions each time.',
   params:[{id:'cycles',label:'Cycles',type:'int',default:4,min:2,max:30},
           {id:'pos_jitter_mm',label:'Position jitter (mm)',type:'int',default:20,min:0,max:100},
           {id:'rot_jitter_deg',label:'Rotation jitter (deg)',type:'int',default:45,min:0,max:180},
           {id:'model',label:'Planner',type:'choice',choices:['haiku','sonnet'],default:'haiku'}]},
  {id:'vr',name:'VR teleoperation',tagline:'Hand-guide the bench from a headset',accent:'#4C8DFF',
   gallery:true,needs_task:false,long_running:true,
   desc:'Starts the VR teleoperation server so you can drive the bench by hand and record demonstrations.',
   params:[{id:'view',label:'View',type:'choice',choices:['mono','stereo'],default:'mono'}]},
];

/* curated protocol library — built from the scene's own objects */
const LIBRARY = [
  {color:'red',   title:'Sort red cube',   task:'Put the red cube in the red bin',     desc:'Pick the red cube and place it in the matching bin.'},
  {color:'green', title:'Sort green cube', task:'Put the green cube in the green bin',  desc:'Pick the green cube and place it in the matching bin.'},
  {color:'blue',  title:'Sort blue cube',  task:'Put the blue cube in the blue bin',    desc:'Pick the blue cube and place it in the matching bin.'},
  {color:'amber', title:'Rack a tube',     task:'Place a Falcon tube into the first rack slot', desc:'Move a Falcon tube into an open slot on the rack.'},
  {color:'blue',  title:'Clear the bench', task:'Push the blue cube off the front edge of the bench', desc:'Demonstration push primitive — clears an object off the bench.'},
  {color:'green', title:'Wave',            task:'Wave goodbye',                          desc:'A quick liveness check — the arm waves.'}
];

/* ---------------- networking (graceful) ---------------- */
async function api(path, opts={}, timeout=4000){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), timeout);
  try{
    const r = await fetch(path, {...opts, signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error('http '+r.status);
    return await r.json();
  }catch(e){ clearTimeout(t); throw e; }
}

async function boot(){
  try{
    const h = await api('/api/health', {}, 2500);
    STATE.mode = h.ready ? 'live' : 'demo';
    STATE._health = h;
    STATE.apps = Array.isArray(h.apps) ? h.apps : [];
    STATE.agentId = (STATE.apps.find(a=>a.chat)||{}).id || null;
    STATE.appId = h.active_app || (contentApps()[0] && contentApps()[0].id) || null;
    STATE.modes = (Array.isArray(h.modes) && h.modes.length) ? h.modes : FALLBACK_MODES;
  }catch{ STATE.mode='demo'; STATE.modes=FALLBACK_MODES; }
  // If the server started with the agent as the active app, present a content
  // app instead — the agent is a persistent place, not a console you land in.
  if(STATE.appId && STATE.appId===STATE.agentId && contentApps().length){
    try{
      const cid=contentApps()[0].id;
      const h2=await api('/api/active',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({app:cid})},5000);
      STATE._health=h2; STATE.mode=h2.ready?'live':'demo';
      STATE.appId=h2.active_app||cid; STATE.apps=Array.isArray(h2.apps)?h2.apps:STATE.apps;
      STATE.modes=(Array.isArray(h2.modes)&&h2.modes.length)?h2.modes:FALLBACK_MODES;
    }catch(e){}
  }
  setConn();
  renderAppSwitcher(); applyAppIdentity(); applySceneChrome();
  try{ const lib = await api('/api/library'); if(Array.isArray(lib)&&lib.length) LIBRARY.splice(0,LIBRARY.length,...lib);}catch{}
  await refreshSessions();
  drawBench();
  render();
  tickClock(); setInterval(tickClock, 10000);
  if(STATE.mode==='live') setInterval(refreshSessions, 8000);
}

function setConn(){
  const c = document.getElementById('conn');
  const live = STATE.mode==='live';
  const scene = hasScene();
  c.className = 'conn '+(live?'live':'demo');
  document.getElementById('connText').textContent =
    live ? (scene?'Connected to bench':'Connected') : (scene?'Demo bench':'Demo mode');
  const banner=document.getElementById('demoBanner');
  banner.style.display = live ? 'none':'block';
  banner.innerHTML = scene
    ? 'Demo bench — simulated runs. Start <code>server.py</code> on the lab machine to drive the live digital twin.'
    : 'Demo mode — this app isn\'t ready to run here (its model or environment is missing). Runs are simulated.';
}

/* ---------------- apps, agent, scene ---------------- */
/* The AI agent is not one of the switchable content apps — it is a persistent
   place reachable from every app. So it is filtered out of the app menu. */
function contentApps(){ return STATE.apps.filter(a=>a.id!==STATE.agentId); }
function appManifest(){ return STATE.apps.find(a=>a.id===STATE.appId)||{}; }
function agentManifest(){ return STATE.apps.find(a=>a.id===STATE.agentId)||{}; }
function hasAgent(){ return !!STATE.agentId; }
/* An app declares a live physical scene (arm/rail/objects) via manifest.scene.
   Only such apps get the bench status strip and the camera pane in Watch. */
function hasScene(){ return !!appManifest().scene; }
/* An app declares a live camera (RealSense/webcam) via manifest.camera. The
   console then shows a live MJPEG pane (served by camera_server.py on :8771). */
function hasCamera(){ return !!appManifest().camera; }
function camStreamUrl(){ return `http://${location.hostname||'localhost'}:8771/stream`; }

function renderAppSwitcher(){
  const sel=document.getElementById('appSel');
  const wrap=document.getElementById('appPicker');
  const apps=contentApps();
  if(sel && wrap){
    if(apps.length<2){ wrap.style.display='none'; }   // nothing to switch between
    else{
      wrap.style.display='';
      sel.innerHTML=apps.map(a=>
        `<option value="${esc(a.id)}"${a.id===STATE.appId?' selected':''}>${esc(a.name||a.id)}</option>`).join('');
    }
  }
  const ab=document.getElementById('agentBtn');
  if(ab){ ab.style.display=hasAgent()?'':'none';
    const nm=agentManifest().name||'Agent';
    const lbl=ab.querySelector('span:last-child'); if(lbl) lbl.textContent=nm==='AI agent'?'Agent':nm; }
}
function applyAppIdentity(){
  const a=STATE.apps.find(x=>x.id===STATE.appId);
  const small=document.querySelector('.brand small');
  if(a&&small) small.textContent=a.name||a.tagline||'Lab OS';
  if(a) document.title='Lab OS — '+(a.name||a.id);
}
/* Show or hide the bench status strip depending on the active app's scene. */
function applySceneChrome(){
  const strip=document.getElementById('benchStrip');
  if(strip) strip.style.display=hasScene()?'':'none';
}
// Per-app wording for the single-task "Ask" surface; bench defaults when the
// active app doesn't override them (manifest ask_* fields).
function askLabels(){
  const a=STATE.apps.find(x=>x.id===STATE.appId)||{};
  return {
    title: a.ask_title||'Ask the bench',
    blurb: a.ask_blurb||'Say what you want in plain words — "put the green cube in the green bin." The bench plans it and runs it.',
    placeholder: a.ask_placeholder||'e.g. Put the green cube in the green bin',
    button: a.ask_button||'Run on the bench',
  };
}
async function switchApp(id){
  if(!id||id===STATE.appId) return;
  let h;
  try{
    h=await api('/api/active',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({app:id})},5000);
  }catch(e){ renderAppSwitcher(); return; }   // revert <select> on failure
  STATE._health=h; STATE.mode=h.ready?'live':'demo';
  STATE.appId=h.active_app||id; STATE.apps=Array.isArray(h.apps)?h.apps:STATE.apps;
  STATE.agentId=(STATE.apps.find(a=>a.chat)||{}).id||STATE.agentId;
  STATE.modes=(Array.isArray(h.modes)&&h.modes.length)?h.modes:FALLBACK_MODES;
  STATE.runMode=null;
  // reload the now-active app's library + saved runs; clear this session's jobs
  try{ const lib=await api('/api/library'); LIBRARY.splice(0,LIBRARY.length,...(Array.isArray(lib)?lib:[])); }
  catch{ LIBRARY.splice(0,LIBRARY.length); }
  STATE.jobs=[]; STATE.sessions=[];
  await refreshSessions();
  setConn(); renderAppSwitcher(); applyAppIdentity(); applySceneChrome();
  STATE.arm='idle'; STATE.rail=0; drawBench();
  STATE.view='home'; render();
}

async function refreshSessions(){
  if(STATE.mode!=='live') return;
  try{ STATE.sessions = await api('/api/sessions'); if(STATE.view==='samples') render(); }catch{}
}

/* ---------------- clock ---------------- */
function tickClock(){
  const d=new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ---------------- bench schematic (signature) ---------------- */
function drawBench(highlight){
  const svg=document.getElementById('benchSvg');
  const COL={red:'#E5484D',green:'#46C26A',blue:'#4C8DFF'};
  let s='';
  // bench surface
  s+=`<rect x="8" y="20" width="744" height="58" rx="8" fill="#101a17" stroke="#243430"/>`;
  // rail (left) with arm carriage
  s+=`<rect x="20" y="30" width="120" height="38" rx="6" fill="#0c1411" stroke="#2E423C"/>`;
  s+=`<text x="80" y="16" fill="#566962" font-size="9" font-family="IBM Plex Mono" text-anchor="middle">RAIL · ARM</text>`;
  const carriageX = 30 + (STATE.rail/700)*96;
  s+=`<rect x="${carriageX}" y="36" width="26" height="26" rx="5" fill="#1B2A26" stroke="${STATE.arm==='idle'?'#2E423C':'#F2B23E'}" stroke-width="${STATE.arm==='idle'?1:2}"/>`;
  s+=`<circle cx="${carriageX+13}" cy="49" r="5" fill="${STATE.arm==='idle'?'#2E423C':'#F2B23E'}"/>`;
  // cubes
  SCENE.cubes.forEach((c,i)=>{
    const x=200+i*60, hot=highlight&&highlight.includes(c.color);
    s+=`<rect x="${x}" y="40" width="22" height="22" rx="4" fill="${COL[c.color]}" opacity="${hot?1:.85}"${hot?` stroke="#fff" stroke-width="1.5"`:''}/>`;
  });
  s+=`<text x="231" y="16" fill="#566962" font-size="9" font-family="IBM Plex Mono" text-anchor="middle">CUBES</text>`;
  // bins
  SCENE.bins.forEach((b,i)=>{
    const x=400+i*54;
    s+=`<rect x="${x}" y="38" width="34" height="26" rx="4" fill="none" stroke="${COL[b.color]}" stroke-width="2" opacity=".9"/>`;
  });
  s+=`<text x="454" y="16" fill="#566962" font-size="9" font-family="IBM Plex Mono" text-anchor="middle">BINS</text>`;
  // racks (2 × 4x2 → show as 2 grids of 6 tubes)
  for(let r=0;r<2;r++){
    const ox=590+r*78;
    s+=`<rect x="${ox-4}" y="32" width="64" height="34" rx="5" fill="#0c1411" stroke="#2E423C"/>`;
    for(let k=0;k<6;k++){
      const cx=ox+6+(k%3)*18, cy=42+Math.floor(k/3)*14;
      s+=`<circle cx="${cx}" cy="${cy}" r="4.5" fill="#1B2A26" stroke="#3a554d"/>`;
    }
  }
  s+=`<text x="668" y="16" fill="#566962" font-size="9" font-family="IBM Plex Mono" text-anchor="middle">TUBE RACKS</text>`;
  svg.innerHTML=s;
  document.getElementById('armState').textContent=STATE.arm;
  document.getElementById('railState').textContent=Math.round(STATE.rail)+' mm';
}

/* ---------------- view router ---------------- */
function go(view){ STATE.view=view; render(); }

function render(){
  const body=document.getElementById('body');
  if(STATE.view==='home') return body.innerHTML=homeView();
  body.innerHTML = viewShell(STATE.view);
  if(STATE.view==='ask') wireAsk();
  if(STATE.view==='watch') renderWatch();
  if(STATE.view==='runmode') wireRunMode();
  if(STATE.view==='chat') wireChat();
}

function homeView(){
  const running = STATE.jobs.filter(j=>j.status==='running').length;
  const done = STATE.mode==='live'? STATE.sessions.length : STATE.jobs.filter(j=>j.status==='done').length;
  const galleryModes = STATE.modes.filter(m=>m.gallery);
  const AL = askLabels();
  const scene = hasScene();
  const tiles = [];

  // The agent — always first, always available, in every app's console.
  if(hasAgent()){
    const an = agentManifest().name || 'AI agent';
    tiles.push(`<div class="tile agent" onclick="go('chat')"><div class="accent"></div>
      <span class="badge">always on</span>
      <div class="ico">${ICO.agent}</div>
      <div><h2>${esc(an)}</h2><p>Chat with the lab agent to get things done in plain words — it can answer questions, work with your files and code, and run any app for you. It's here in every console and remembers the conversation.</p></div>
    </div>`);
  }

  // The active app's primary "ask" surface.
  tiles.push(`<div class="tile ask" onclick="go('ask')"><div class="accent"></div>
    <div class="ico">${ICO.ask}</div>
    <div><h2>${esc(AL.title)}</h2><p>${esc(AL.blurb)}</p></div>
  </div>`);

  // Presets/library — only if the app ships any.
  if(LIBRARY.length){
    tiles.push(`<div class="tile proto" onclick="go('library')"><div class="accent"></div>
      <span class="badge">${LIBRARY.length} ready</span>
      <div class="ico">${ICO.proto}</div>
      <div><h2>${scene?'Run a protocol':'Ready-made runs'}</h2><p>${scene
        ?'Pick a saved task from the library and press go. No typing needed.'
        :'Pick a ready-made example and run it — no typing needed.'}</p></div>
    </div>`);
  }

  // Run modes — only if the app declares more than the single default task.
  if(galleryModes.length){
    tiles.push(`<div class="tile modes" onclick="go('modes')"><div class="accent"></div>
      <span class="badge">${galleryModes.length} mode${galleryModes.length===1?'':'s'}</span>
      <div class="ico">${ICO.modes}</div>
      <div><h2>Run modes</h2><p>${scene
        ?'Ways to run the bench beyond one task: self-learning loops, auto-play batches, random-play data runs, task augmentation and VR teleoperation.'
        :'Different ways to run this app beyond a single request.'}</p></div>
    </div>`);
  }

  // Watch/Monitor — live camera for scene/camera apps, run log otherwise.
  const camv = hasCamera();
  tiles.push(`<div class="tile watch" onclick="go('watch')"><div class="accent"></div>
    <span class="badge">${running?running+' running':'idle'}</span>
    <div class="ico">${ICO.watch}</div>
    <div><h2>${scene||camv?'Watch':'Monitor'}</h2><p>${
      scene?'See the live bench camera, what\'s running now, and the queue.'
      :camv?'See the live camera feed, what\'s running now, and the queue.'
      :'Follow the live run log and the queue as jobs run.'}</p></div>
  </div>`);

  // Runs & results.
  tiles.push(`<div class="tile samples" onclick="go('samples')"><div class="accent"></div>
    <span class="badge">${done} run${done===1?'':'s'}</span>
    <div class="ico">${ICO.samples}</div>
    <div><h2>${scene?'My samples &amp; results':'Runs &amp; results'}</h2><p>${scene
      ?'Every run is saved with its plates, tubes and trajectory. Browse and replay.'
      :'Every run is saved with its inputs, outputs and files. Browse past runs.'}</p></div>
  </div>`);

  return `<div class="home">${tiles.join('')}</div>`;
}

/* view header titles — scene apps keep bench wording; compute apps get neutral
   wording so the console reads as "just this app". ask/chat use per-app labels. */
function viewTitle(v){
  const scene=hasScene(); const cam=hasCamera();
  const T={
    library:[scene?'Run a protocol':'Ready-made runs', scene?'pick a saved task':'pick an example and run it'],
    modes:['Run modes', scene?'ways to run the bench':'ways to run this app'],
    watch:[scene||cam?'Watch':'Monitor', scene?'live bench &amp; queue':cam?'live camera &amp; queue':'run log &amp; queue'],
    samples:[scene?'My samples & results':'Runs & results','saved runs'],
  };
  return T[v]||['',''];
}
function viewShell(v){
  if(v==='chat'){
    return `<div class="view">
      <div class="view-head">
        <button class="back" onclick="go('home')" aria-label="Back to home">‹</button>
        <h2>${esc(agentManifest().name||'AI agent')}</h2><span class="sub">persistent chat · files &amp; code · runs any app</span>
      </div>
      <div class="view-body chat-body" id="vbody">${chatView()}</div>
    </div>`;
  }
  if(v==='runmode'){
    const m=currentMode()||{};
    const [t,s]=[esc(m.name||'Run'),esc(m.tagline||'')];
    const back=`onclick="go('modes')"`;
    return `<div class="view">
      <div class="view-head">
        <button class="back" ${back} aria-label="Back to modes">‹</button>
        <h2>${t}</h2><span class="sub">${s}</span>
      </div>
      <div class="view-body" id="vbody">${runModeView()}</div>
    </div>`;
  }
  let [t,s]= v==='ask' ? [esc(askLabels().title),'say it in plain words'] : viewTitle(v);
  return `<div class="view">
    <div class="view-head">
      <button class="back" onclick="go('home')" aria-label="Back to home">‹</button>
      <h2>${t}</h2><span class="sub">${s}</span>
    </div>
    <div class="view-body" id="vbody">${{ask:askView,library:libView,modes:modesView,watch:watchView,samples:samplesView}[v]()}</div>
  </div>`;
}

/* ---- ASK ---- */
function askView(){
  const AL = askLabels();
  return `<div class="ask-wrap">
    <div class="ask-box">
      <textarea id="task" placeholder="${esc(AL.placeholder)}"></textarea>
      <div class="ask-row">
        <div class="model-pick">
          <span class="chip ${STATE.model==='haiku'?'on':''}" data-m="haiku">haiku · fast</span>
          <span class="chip ${STATE.model==='sonnet'?'on':''}" data-m="sonnet">sonnet · careful</span>
        </div>
        <button class="go" id="runBtn">${ICO.play}<span>${esc(AL.button)}</span></button>
      </div>
    </div>
    <div class="suggest">
      <div class="label">Try one</div>
      <div class="sug-list">${LIBRARY.slice(0,5).map(l=>`<span class="sug" data-task="${esc(l.task)}">${esc(l.task)}</span>`).join('')}</div>
    </div>
  </div>`;
}
function wireAsk(){
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{STATE.model=c.dataset.m;render();});
  document.querySelectorAll('.sug').forEach(s=>s.onclick=()=>{document.getElementById('task').value=s.dataset.task;});
  document.getElementById('runBtn').onclick=()=>{
    const t=document.getElementById('task').value.trim();
    if(t) submit(t);
  };
}

/* ---- AI AGENT CHAT (persistent, streaming, app-independent) ----
   The chat always talks to the agent app (manifest chat:true), whichever content
   app is active — so the conversation is available in every console and persists
   across app switches. */
function ensureChat(){
  if(!STATE.chat) STATE.chat={id:null,es:null,messages:[],cur:null,busy:false,ended:false,
    pendingReset:false,params:{brain:(agentManifest().models||['haiku'])[0]||'haiku',intent:'preview'}};
  return STATE.chat;
}
function truncate(s,n){ s=String(s); return s.length>n?s.slice(0,n)+'…':s; }

function chatView(){
  const c=ensureChat();
  const brains=agentManifest().models||['haiku','sonnet'];
  const head=`<div class="chat-head">
    <div class="grp"><span class="glabel">Brain</span>${brains.map(b=>
      `<span class="chip cbrain ${b===c.params.brain?'on':''}" data-b="${esc(b)}">${esc(b)}</span>`).join('')}</div>
    <div class="grp"><span class="glabel">Action</span>
      <span class="chip cintent ${c.params.intent==='preview'?'on':''}" data-i="preview">preview</span>
      <span class="chip cintent ${c.params.intent==='run'?'on':''}" data-i="run">run</span></div>
    <div class="spacer"></div>
    <button class="chat-new" id="chatNew">＋ New chat</button>
  </div>`;
  const thread=`<div class="chat-thread" id="chatThread">${threadHtml()}</div>`;
  const ph=agentManifest().ask_placeholder||'Ask in plain words — or ask it to work on a file…';
  const input=`<div class="chat-input">
    <textarea id="chatText" rows="1" placeholder="${esc(ph)}"></textarea>
    <button class="go" id="chatSend">${ICO.play}<span>Send</span></button>
  </div>`;
  return `<div class="chat">${head}${thread}${input}</div>`;
}

function threadHtml(){
  const c=ensureChat();
  if(!c.messages.length) return `<div class="chat-empty">Start a conversation. The agent can find and run any app for you — and it can work with files and code: e.g. “add an <b>age_next_year</b> column to results.csv” or “sample 10 sequences from proteins.fasta”. It remembers the conversation, so you can follow up.</div>`;
  return c.messages.map(msgHtml).join('');
}
function msgHtml(m){
  if(m.role==='user') return `<div class="msg user"><div class="bubble">${esc(m.text)}</div></div>`;
  if(m.role==='error') return `<div class="msg agent"><div class="who">agent</div>
    <div class="bubble" style="border-color:var(--err);color:var(--err)">${esc(m.text)}</div></div>`;
  const tools=(m.tools&&m.tools.length)?`<div class="tools">${m.tools.map(toolHtml).join('')}</div>`:'';
  const cur=m.streaming?'<span class="cursor-blink"></span>':'';
  const body=m.text?mdToHtml(m.text):(m.streaming?'':'<span style="color:var(--muted-2)">…</span>');
  return `<div class="msg agent"><div class="who">agent</div>${tools}<div class="bubble">${body}${cur}</div></div>`;
}
function toolHtml(t){
  const st=t.result==null?'<span class="tspin">▶ running…</span>':'<span class="tdone">✓ done</span>';
  const args=t.args?truncate(JSON.stringify(t.args),90):'';
  const res=t.result!=null?`<pre>${esc(String(t.result))}</pre>`:'';
  return `<details class="tool"><summary><span class="tname">${esc(t.name)}</span>
    <span class="targs">${esc(args)}</span> ${st}</summary>${res}</details>`;
}
/* tiny markdown: fenced code, inline code, bold */
function mdToHtml(s){
  const parts=String(s).split('```'); let out='';
  parts.forEach((seg,i)=>{
    if(i%2===1){ const nl=seg.indexOf('\n'); const code=nl>=0?seg.slice(nl+1):seg;
      out+=`<pre><code>${esc(code.replace(/\n$/,''))}</code></pre>`; }
    else{ let h=esc(seg); h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
      h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); out+=h; }
  });
  return out;
}

function paintChat(){
  const thread=document.getElementById('chatThread'); if(!thread) return;
  const nearBottom = thread.scrollHeight-thread.scrollTop-thread.clientHeight < 120;
  thread.innerHTML=threadHtml();
  if(nearBottom) thread.scrollTop=thread.scrollHeight;
}
function setChatSendEnabled(on){
  const b=document.getElementById('chatSend'); if(b) b.disabled=!on;
}
function pushChatError(text){ const c=ensureChat(); c.messages.push({role:'error',text}); paintChat(); }

function closeChatStream(){ const c=ensureChat(); if(c.es){ try{c.es.close();}catch(e){} c.es=null; } }

async function startChatSession(reset){
  const c=ensureChat();
  if(c.id){ try{ await api('/api/chat/stop',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chat_id:c.id})},4000);}catch(e){} }
  closeChatStream();
  const params={brain:c.params.brain,intent:c.params.intent,session:'console'};
  if(reset) params.memory='new';
  let res;
  try{
    res=await api('/api/chat/start',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({app:STATE.agentId,params})},8000);
  }catch(e){ pushChatError('Could not start the agent. Is the server running and the agent ready (API key set)?'); return null; }
  c.id=res.chat_id; c.ended=false; c.cur=null;
  openChatStream(c.id);
  return c.id;
}
function openChatStream(id){
  const c=ensureChat();
  const es=new EventSource('/api/chat/stream?chat_id='+encodeURIComponent(id));
  c.es=es;
  es.onmessage=ev=>{ let d; try{ d=JSON.parse(ev.data); }catch(e){ return; } onChatEvent(d); };
  es.onerror=()=>{ if(c.ended){ closeChatStream(); } };  // else let the browser retry
}
function onChatEvent(d){
  const c=ensureChat();
  switch(d.type){
    case 'turn_start': c.cur={role:'agent',text:'',tools:[],streaming:true}; c.messages.push(c.cur); paintChat(); break;
    case 'token':
      if(!c.cur){ c.cur={role:'agent',text:'',tools:[],streaming:true}; c.messages.push(c.cur); }
      c.cur.text+=d.text; paintChat(); break;
    case 'tool_start':
      if(c.cur){ c.cur.tools.push({name:d.name,args:d.args,result:null}); paintChat(); } break;
    case 'tool_end':
      if(c.cur){ const pend=c.cur.tools.filter(x=>x.name===d.name&&x.result==null);
        if(pend.length) pend[pend.length-1].result=d.result;
        else c.cur.tools.push({name:d.name,args:null,result:d.result}); paintChat(); } break;
    case 'final':
      if(c.cur){ if(d.text) c.cur.text=d.text; c.cur.streaming=false; c.cur=null; }
      c.busy=false; setChatSendEnabled(true); paintChat(); break;
    case 'error':
      if(c.cur) c.cur.streaming=false;
      pushChatError(d.text||'agent error'); c.busy=false; setChatSendEnabled(true); break;
    case 'closed':
      c.ended=true; closeChatStream(); c.busy=false; setChatSendEnabled(true); break;
  }
}
async function sendChat(){
  const c=ensureChat();
  const ta=document.getElementById('chatText'); if(!ta) return;
  const text=ta.value.trim(); if(!text||c.busy) return;
  ta.value=''; ta.style.height='auto';
  c.messages.push({role:'user',text}); paintChat();
  c.busy=true; setChatSendEnabled(false);
  if(!c.id||c.ended){
    const id=await startChatSession(c.pendingReset); c.pendingReset=false;
    if(!id){ c.busy=false; setChatSendEnabled(true); return; }
  }
  try{
    await api('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:c.id,text})},8000);
  }catch(e){ pushChatError('Message not delivered — the agent may have stopped. Try “New chat”.');
    c.busy=false; setChatSendEnabled(true); }
}
async function newChat(){
  const c=ensureChat();
  if(c.id){ try{ await api('/api/chat/stop',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chat_id:c.id})},4000);}catch(e){} }
  closeChatStream();
  c.id=null; c.ended=false; c.cur=null; c.messages=[]; c.busy=false; c.pendingReset=true;
  render();
}
async function changeChatSetting(k,v){
  const c=ensureChat();
  if(c.params[k]===v) return;
  c.params[k]=v;
  // Settings are baked into the agent process at launch. If one is live, swap it
  // WITHOUT wiping memory (session replays), so the visible conversation survives.
  if(c.id && !c.ended){ await startChatSession(false); }
  render();
}
function wireChat(){
  const c=ensureChat();
  document.querySelectorAll('.cbrain').forEach(el=>el.onclick=()=>changeChatSetting('brain',el.dataset.b));
  document.querySelectorAll('.cintent').forEach(el=>el.onclick=()=>changeChatSetting('intent',el.dataset.i));
  const nb=document.getElementById('chatNew'); if(nb) nb.onclick=()=>newChat();
  const ta=document.getElementById('chatText');
  if(ta){
    ta.focus();
    ta.oninput=()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,160)+'px'; };
    ta.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendChat(); } };
  }
  const sb=document.getElementById('chatSend'); if(sb) sb.onclick=()=>sendChat();
  setChatSendEnabled(!c.busy);
  paintChat();
}

/* generic parameter form built from a mode's descriptor */
function pInputId(mode,pid){ return `p_${mode}_${pid}`; }
function paramField(mode,p){
  const id=pInputId(mode.id,p.id);
  if(p.type==='choice'){
    const chips=(p.choices||[]).map(c=>
      `<span class="chip" data-pid="${esc(p.id)}" data-val="${esc(c)}">${esc(c)}</span>`).join('');
    return `<div class="pfield" data-field="${esc(p.id)}" data-default="${esc(p.default)}">
      <label>${esc(p.label||p.id)}</label><div class="pchips" id="${id}">${chips}</div></div>`;
  }
  if(p.type==='bool'){
    return `<div class="pfield"><label class="ptoggle">
      <input type="checkbox" id="${id}" ${p.default?'checked':''}/> ${esc(p.label||p.id)}</label></div>`;
  }
  // int (default)
  const min=(p.min!=null)?`min="${p.min}"`:'';
  const max=(p.max!=null)?`max="${p.max}"`:'';
  const val=(p.default===''||p.default==null)?'':p.default;
  const ph=p.optional?'optional':'';
  return `<div class="pfield"><label>${esc(p.label||p.id)}</label>
    <input type="number" id="${id}" value="${esc(val)}" ${min} ${max} placeholder="${ph}"/></div>`;
}

function wireRunMode(){
  const m=currentMode(); if(!m) return;
  // choice chips: reflect default selection + click to choose
  (m.params||[]).filter(p=>p.type==='choice').forEach(p=>{
    const box=document.getElementById(pInputId(m.id,p.id)); if(!box) return;
    const def=p.default;
    box.querySelectorAll('.chip').forEach(c=>{
      if(c.dataset.val===String(def)) c.classList.add('on');
      c.onclick=()=>{ box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); c.classList.add('on'); };
    });
  });
  document.getElementById('runBtn').onclick=()=>{
    const task=m.needs_task?(document.getElementById('task').value.trim()):'';
    if(m.needs_task && !task){ const ta=document.getElementById('task'); if(ta) ta.focus(); return; }
    submitRun(m, task, collectParams(m));
  };
}

function collectParams(m){
  const out={};
  (m.params||[]).forEach(p=>{
    const id=pInputId(m.id,p.id);
    if(p.type==='choice'){
      const box=document.getElementById(id); const on=box&&box.querySelector('.chip.on');
      out[p.id]=on?on.dataset.val:p.default;
    }else if(p.type==='bool'){
      const el=document.getElementById(id); out[p.id]=!!(el&&el.checked);
    }else{
      const el=document.getElementById(id); const v=el?el.value.trim():'';
      out[p.id]=v;   // server tolerates blanks/strings and clamps to defaults
    }
  });
  return out;
}

/* ---------------- run a task (live or demo) ---------------- */
/* the "Ask"/protocol path: a single task in the default task mode */
function submit(task){
  const m=STATE.modes.find(x=>x.id==='task')||{id:'task',needs_task:true};
  return submitRun(m, task, {model:STATE.model});
}

async function submitRun(mode, task, params){
  if(STATE.busy) return;
  STATE.busy=true;
  const job={id:'j'+Date.now(), sid:null, mode:mode.id, modeName:mode.name,
    longRunning:!!mode.long_running, task:task||mode.name, model:(params&&params.model)||null,
    params:params||{}, status:'running', log:[], started:new Date().toISOString(), outcome:null};
  STATE.jobs.push(job);
  go('watch');
  if(STATE.mode==='live') await runLive(job); else await runDemo(job, mode);
  STATE.busy=false;
  STATE.arm='idle'; drawBench();
  if(STATE.view==='watch') renderWatch();
  refreshSessions();
}

async function stopJob(job){
  if(!job||!job.sid) return;
  job.stopping=true;
  try{ await api('/api/job/'+job.sid+'/stop',{method:'POST'},5000);}catch{}
  if(STATE.view==='watch') renderWatch();
}

async function runLive(job){
  try{
    const res=await api('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mode:job.mode,task:job.task,params:job.params})}, 6000);
    job.sid=res.job_id;
    if(STATE.view==='watch') renderWatch();   // surface Stop as soon as it's running
    // poll
    while(true){
      await sleep(900);
      let st; try{ st=await api('/api/job/'+job.sid,{},5000);}catch{ break; }
      job.log = (st.log||[]).map(coerceLine);
      if(st.arm!=null){STATE.arm=st.arm;} if(st.rail!=null){STATE.rail=st.rail;}
      animateFromTask(job.task);
      if(STATE.view==='watch') renderWatch();
      if(st.status==='done'||st.status==='error'||st.status==='stopped'){
        job.status=st.status; job.outcome=st.outcome||(st.status==='error'?'error':st.status); break;
      }
    }
  }catch(e){
    job.status='error'; job.outcome='error';
    job.log.push({k:'err',t:'Could not reach the bench. Is server.py running on the lab machine?'});
  }
}

/* demo: plausible traces per mode so the console is feelable without the sim */
async function runDemo(job, mode){
  const steps=DEMO_STEPS(mode||{id:job.mode}, job);
  for(const st of steps){
    if(job.stopping){ job.log.push({k:'',t:'— stopped —'}); job.status='stopped'; job.outcome='stopped'; return; }
    await sleep(520+Math.random()*420);
    job.log.push({k:st.k,t:st.t});
    if(st._arm){STATE.arm=st._arm;} if(st._rail!=null){STATE.rail=st._rail;}
    drawBench(st._hl); if(STATE.view==='watch') renderWatch();
  }
  job.status='done'; job.outcome='success';
}

function DEMO_STEPS(mode, job){
  const p=job.params||{}; const color=(String(job.task).match(/red|green|blue/i)||['blue'])[0].toLowerCase();
  const zone=c=>c==='red'?120:c==='green'?180:240;
  const sess=()=>'recordings/'+ts()+'_session_'+Math.floor(Math.random()*900+100);
  const one=(c,ep)=>[
    {k:'plan',t:`plan: locate ${c}_cube → grasp → carry → release over ${c}_bin`},
    {k:'',t:`move_rail → ${c} zone`,_arm:'moving',_rail:zone(c),_hl:c},
    {k:'',t:`pick_object(${c}_cube)`,_arm:`grasp ${c}`,_hl:c},
    {k:'',t:`place_object(${c}_bin)`,_arm:`place ${c}`,_hl:c},
    {k:'ok',t:`✓ ${ep||'task'} complete · outcome: success`},
  ];
  switch(mode.id){
    case 'learn':{
      const n=Math.min(parseInt(p.max_episodes)||4,6); let s=[{k:'dim',t:`$ self-learning loop · "${job.task}" · ${n} attempts`}];
      for(let i=1;i<=n;i++){ s.push({k:'plan',t:`Episode ${i}/${n}`}); s.push(...one(color,`episode ${i}`)); }
      s.push({k:'ok',t:`RUN SUMMARY · success ${Math.ceil(n/2)+1}/${n} · Trend: IMPROVING`});
      return s; }
    case 'autoplay':{
      const n=Math.min(parseInt(p.episodes)||3,5); const tasks=['Put the red cube in the blue bin','Rack a Falcon tube','Push the green cube off the bench','Sort the cubes by colour','Place the blue cube in the green bin'];
      let s=[{k:'plan',t:`[AutoPlay] Generating ${n} diverse tasks…`}];
      for(let i=1;i<=n;i++){ const c=['red','green','blue'][i%3]; s.push({k:'plan',t:`Episode ${i}/${n}: ${tasks[i-1]||'task'}`}); s.push(...one(c,`ep ${i}`)); s.push({k:'ok',t:`Saved: ${ts()}_session_auto_ep${i}`}); }
      s.push({k:'ok',t:`[AutoPlay] Done. ${n} episodes saved.`});
      return s; }
    case 'random':{
      const n=Math.min(parseInt(p.episodes)||3,4), mv=Math.min(parseInt(p.moves_per_episode)||4,6);
      let s=[{k:'plan',t:`[RandomPlay] ${n} runs × ${mv} moves · no planner`},{k:'plan',t:'[RandomPlay] sampling reachable poses…'}];
      for(let i=1;i<=n;i++){ s.push({k:'plan',t:`Episode ${i}/${n}`});
        for(let k=1;k<=mv;k++) s.push({k:'',t:`  move ${k}: OK`,_arm:'moving',_rail:80+Math.floor(Math.random()*540)});
        s.push({k:'ok',t:`Saved: ${ts()}_session_rand_ep${i}`}); }
      s.push({k:'ok',t:`[RandomPlay] Done. ${n} runs saved.`});
      return s; }
    case 'augment':{
      const n=Math.min(parseInt(p.cycles)||3,5);
      let s=[{k:'plan',t:`[Augment] ${n} cycles · ±${p.pos_jitter_mm||20}mm / ±${p.rot_jitter_deg||45}°`}];
      for(let i=1;i<=n;i++){ s.push({k:'plan',t:`[Cycle ${i}] ${i===1?'original prompt':'paraphrase + jitter'}`}); s.push(...one(color,`cycle ${i}`)); }
      s.push({k:'ok',t:`OK ${n} sessions saved.`});
      return s; }
    case 'vr':
      return [{k:'plan',t:'[VR] building twin (headless)…'},
        {k:'plan',t:`[VR] mode=${p.view||'mono'} · record=on`},
        {k:'ok',t:'[VR] Open on the headset: https://<lab-ip>:8443'},
        {k:'',t:'[VR] waiting for headset… press Stop here when finished',_arm:'idle'},
        {k:'',t:'[VR] (demo) idle — no headset connected'}];
    default:
      return [{k:'dim',t:`$ run_task "${job.task}" --model ${job.model||'haiku'}`},
        {k:'',t:'Planning task…'},...one(color),{k:'dim',t:'saved → '+sess()+'/'}];
  }
}

function animateFromTask(task){
  const color=(task.match(/red|green|blue/i)||[''])[0].toLowerCase();
  if(color) drawBench(color);
}

/* ---------------- helpers ---------------- */
function coerceLine(l){ if(typeof l==='string'){
  const k=/✓|success|complete/i.test(l)?'ok':/error|fail|traceback/i.test(l)?'err':/plan|locate|grasp/i.test(l)?'plan':'';
  return {k,t:l}; } return l; }
function fmtTime(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return String(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function ts(){ const d=new Date(); return d.toISOString().slice(0,19).replace(/[-:T]/g,''); }
function esc(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
